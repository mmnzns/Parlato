[package]
name = "parla"
version = "0.14.1"
description = "Parla - dictee vocale locale et cloud pour Windows"
authors = ["Parla contributors"]
edition = "2021"

[lib]
name = "parla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
# Parlato : notification Windows "Parlato tourne toujours" (fermeture vers le tray).
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
anyhow = "1"
parking_lot = "0.12"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Audio capture WASAPI (via cpal)
cpal = "0.15"
hound = "3.5"
rubato = "0.16"
ringbuf = "0.4"
# Lecture des sons de feedback (start / stop / cancel). rodio 0.20 partage
# le meme cpal 0.15 que la capture, donc pas de doublon dans l'arbre.
rodio = "0.20"
# Parlato: decodage des fichiers audio/video pour "Transcribe a file"
# (mp3, m4a/aac, alac, flac, ogg/vorbis, wav, aiff, caf, mp4/mkv audio).
# Meme version que celle tiree par rodio, donc pas de doublon.
symphonia = { version = "0.5", features = ["all"] }
uuid = { version = "1", features = ["v4"] }
arboard = "3"

# Post-traitement texte
regex = "1"
fancy-regex = "0.14"
unicode-segmentation = "1"

# Persistence SQLite (dictionnaire, historique)
rusqlite = { version = "0.33", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart", "json"] }
futures-util = "0.3"

# Capture de fenetre active (Phase 7 screen context).
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }

# Providers cloud
async-trait = "0.1"
base64 = "0.22"
keyring = "3"
urlencoding = "2"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

# Shared engine (voice-engine, MIT): models, speech, local AI client. Every
# engine crate stays on the same tag. Code flows from the engine into Parlato
# only, never the other way (see CLAUDE.md "One shared engine").
voice-engine-protocol = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.3.0" }
voice-engine-client = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.3.0" }
voice-engine-models = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.3.0" }
voice-engine-stt = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.3.0" }

[dev-dependencies]
# Tests of the model store use temp folders, never the real shared folder.
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Parakeet on the graphics card through the engine (DirectML), chosen at run
# time by the `use_gpu` setting (and asked for the card at startup,
# `discrete_card`). Cargo unifies the features with the
# entry in [dependencies]. Whisper and Parakeet themselves (whisper-rs,
# parakeet-rs) come in through voice-engine-stt, not directly.
voice-engine-stt = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.3.0", features = ["directml"] }
# UI Automation pour l'extraction d'URL des navigateurs (Power Mode).
uiautomation = "0.24"
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Devices_FunctionDiscovery",
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Foundation_Collections",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# API keys in the macOS Keychain (Windows uses Credential Manager above).
keyring = { version = "3", features = ["apple-native"] }
# Global hotkey tap and Cmd+V paste (CGEventTap / CGEvent).
core-graphics = "0.25"
core-foundation = "0.10"
# Permission checks, frontmost app and full clipboard backup (Cocoa APIs).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSPasteboardItem", "NSScreen"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
# Info.plist of the installed apps (bundle identifier and name), already in the
# tree through Tauri.
plist = "1"

# rustc 1.95 plante (STATUS_ACCESS_VIOLATION) en compilant tokenizers
# v0.22 a opt-level 3 sur Windows MSVC. On baisse l'opt-level juste pour
# cette crate, ca evite la faute memoire du compilateur sans impact runtime
# significatif (la lib est utilisee uniquement au load du modele Parakeet).
[profile.release.package.tokenizers]
opt-level = 1

# Parlato : les dependances sont optimisees aussi dans les builds de test
# (comme Talaan). Sans ca, le build de test plantait au chargement de la
# detection de voix (2026-10-28) et les modeles tournaient tres lentement.
# Le code de Parlato lui-meme reste en debug. Meme exception que plus haut
# pour tokenizers.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.tokenizers]
opt-level = 1


