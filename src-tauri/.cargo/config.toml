# Configuration Cargo propre a Parla.
#
# /FORCE:MULTIPLE : llama-cpp-sys-2 et whisper-rs-sys embarquent tous les deux
# le runtime ggml (issue ggml-org/llama.cpp#9267, ggml-org/whisper.cpp#1887).
# La duplication des symboles ggml-quants fait echouer le link Windows. Les
# fonctions en conflit sont des quantize_row_* bas niveau dont l'ABI est
# stable entre versions ; le linker garde la premiere definition. Ce flag
# disparaitra le jour ou l'ecosysteme Rust partagera une lib ggml commune.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-args=/FORCE:MULTIPLE /IGNORE:4006 /IGNORE:4088"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-args=/FORCE:MULTIPLE /IGNORE:4006 /IGNORE:4088"]

# Parlato : sous Windows, la crate `cmake` utilise le generateur Visual Studio
# et retire tous les `/O` de CMAKE_C/CXX_FLAGS_RELEASE, si bien que
# whisper.cpp (whisper-rs-sys) etait compile sans optimisation (/Od) en
# release. whisper-rs-sys transmet chaque variable d'environnement CMAKE_* a
# CMake, donc on lui redonne -O2 ici. llama-cpp-sys-2 fixe deja ses propres
# options (/O2 /Ob2). Mesure le 2026-10-15 : voir CHANGELOG.md.
# Apres un changement ici : `cargo clean --release -p whisper-rs-sys`.
[env]
CMAKE_C_FLAGS_RELEASE = "-O2 -DNDEBUG"
CMAKE_CXX_FLAGS_RELEASE = "-O2 -DNDEBUG"

# Parlato : llama.cpp (llama-cpp-sys-2) compile sa copie de cpp-httplib avec
# OpenSSL s'il le trouve. Parlato ne s'en sert pas (les modeles sont
# telecharges par Parlato lui-meme), et l'OpenSSL des runners macOS de
# GitHub ne compile plus avec cette version de httplib (2026-10-15 :
# "cannot initialize a variable of type 'X509_NAME *'"). llama-cpp-sys-2 ne
# transmet a CMake que les variables CMAKE_*, d'ou cette variable-ci : elle
# empeche find_package(OpenSSL), httplib est alors compile sans HTTPS.
CMAKE_DISABLE_FIND_PACKAGE_OpenSSL = "TRUE"
