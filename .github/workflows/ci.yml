name: CI

# Builds and tests Parlato on Windows and macOS on every push to main and
# every pull request, so a change made on one platform cannot silently
# break the other. Release builds stay in release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest # Apple Silicon

    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ci-${{ matrix.os }}

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      # Same fixed CPU baseline for ggml as release.yml, so a change that
      # breaks it shows up on pull requests, not at release time.
      - name: CPU baseline for whisper.cpp and llama.cpp
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          . ./scripts/cpu-baseline.ps1
          Set-GgmlBaseline x64
          Reset-StaleGgml src-tauri/Cargo.toml x64 dev

      # tauri-build checks that every externalBin file exists. The tests never
      # start the local AI helper, so an empty placeholder is enough here.
      - name: Placeholder for the local AI helper (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/parlato-llm-aarch64-apple-darwin

      - name: Placeholder for the local AI helper (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force src-tauri/binaries/parlato-llm-x86_64-pc-windows-msvc.exe | Out-Null

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Check the CPU baseline
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          . ./scripts/cpu-baseline.ps1
          Assert-GgmlBaseline src-tauri/Cargo.toml x64 dev
