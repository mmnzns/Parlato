name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Parlato's local AI helper (parlato-llm, plus parlato-llm-vulkan on Windows
  # x64), built by the shared engine's reusable workflow at the same tag the
  # app's Cargo.toml pins. One artifact per target, "helpers-<triple>", with
  # the helper files, SHA256SUMS and build-info.txt. The app jobs below
  # download it into src-tauri/binaries, where Tauri finds the externalBin
  # sidecars. Keep the two tags (@v0.2.2, engine-ref) equal to Cargo.toml's.
  helpers:
    uses: mmnzns/voice-engine/.github/workflows/build-helpers.yml@v0.2.2
    with:
      engine-ref: v0.2.2
      helpers: llm,llm-vulkan
      llm-name: parlato-llm

  # CPU variants (x64 + ARM64). Produces signed installers + updater
  # artifacts (latest.json + .sig files). The Tauri updater in the
  # installed app points to this job's latest.json.
  #
  # gpu-detect is disabled on ARM64 (--no-default-features) because
  # NVIDIA does not ship nvml.dll for Windows ARM64. All other features
  # (whisper.cpp, ONNX Runtime, WASAPI audio, etc.) compile natively for both
  # architectures. llama.cpp is not built here: it lives in the parlato-llm
  # helper from the "helpers" job.
  #
  # Windows x64 also ships parlato-llm-vulkan.exe (the graphics card build of
  # the helper): src-tauri/tauri.windows-x64.conf.json, passed with --config,
  # lists both helpers in externalBin. ARM64 lists parlato-llm only.
  cpu:
    needs: helpers
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            # --config merges over tauri.conf.json (JSON merge patch: the
            # externalBin array is replaced, so the file lists both helpers).
            cargo-args: "--config src-tauri/tauri.windows-x64.conf.json"
          - arch: arm64
            runner: windows-11-arm
            rust-target: aarch64-pc-windows-msvc
            cargo-args: "-- --no-default-features"

    name: cpu (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: cpu-${{ matrix.arch }}

      - name: Download the local AI helpers
        uses: actions/download-artifact@v4
        with:
          name: helpers-${{ matrix.rust-target }}
          path: src-tauri/binaries

      # Tauri only bundles the externalBin files. Keep the engine's record
      # files (checksums of the unsigned helpers, versions used) as an
      # uploaded artifact instead of leaving them in src-tauri/binaries.
      - name: Set the helper record files aside
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p helpers-record
          mv src-tauri/binaries/SHA256SUMS src-tauri/binaries/build-info.txt helpers-record/
          ls -l src-tauri/binaries

      - name: Install npm dependencies
        run: npm ci

      - name: Enable updater artifacts
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle.createUpdaterArtifacts = $true
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8

      - name: Setup MSVC ARM64 developer environment
        if: matrix.arch == 'arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Use Clang for ARM64 native C/C++ (ggml requirement)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          echo "CC=clang-cl" >> $env:GITHUB_ENV
          echo "CXX=clang-cl" >> $env:GITHUB_ENV
          echo "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          echo "CFLAGS=--target=aarch64-pc-windows-msvc" >> $env:GITHUB_ENV
          echo "CXXFLAGS=--target=aarch64-pc-windows-msvc /EHsc" >> $env:GITHUB_ENV

      # Parlato: whisper.cpp defaults to GGML_NATIVE=ON, which compiles it for
      # this runner's CPU (AVX-512 on some runners), and the installer would
      # then crash with "illegal instruction" on most Intel PCs. Build ggml
      # for a fixed baseline instead (scripts/cpu-baseline.ps1), and clean the
      # -sys crate when the Rust cache holds a build made without it. The
      # helper's llama.cpp baseline is checked by the engine's workflow.
      - name: CPU baseline for whisper.cpp
        shell: pwsh
        run: |
          . ./scripts/cpu-baseline.ps1
          Set-GgmlBaseline ${{ matrix.arch }}
          Reset-StaleGgml src-tauri/Cargo.toml ${{ matrix.arch }} release ${{ matrix.rust-target }}

      # Parlato: the release page shows this version's CHANGELOG.md section,
      # so everyone sees what changed. A tag without its section fails here.
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d' \
            -e 's#](docs/#](https://github.com/mmnzns/Parlato/blob/main/docs/#g' > section.md
          # Release pages show every line break, so join the changelog's
          # wrapped lines back into one line per item.
          awk '
            function flush() { if (buf != "") print buf; buf = "" }
            /^[[:space:]]*$/ { flush(); print; next }
            /^#/ { flush(); print; next }
            /^[[:space:]]*- / { flush(); buf = $0; next }
            { line = $0; sub(/^[[:space:]]+/, "", line); buf = (buf == "") ? line : buf " " line }
            END { flush() }
          ' section.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi
          {
            echo "body<<PARLATO_NOTES_EOF"
            cat notes.md
            echo "PARLATO_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build + sign + bundle (CPU ${{ matrix.arch }})
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Parlato ${{ github.ref_name }}"
          releaseBody: |
            ## What's new

            ${{ steps.notes.outputs.body }}

            Earlier versions: [full changelog](https://github.com/mmnzns/Parlato/blob/main/CHANGELOG.md).

            **Which file do I download?**
            - `Parlato_x.y.z_x64-setup.exe`: almost every Windows PC.
            - `Parlato_x.y.z_arm64-setup.exe`: Windows on ARM (Snapdragon laptops).
            - `Parlato_x.y.z_aarch64.dmg`: Mac with Apple silicon (M1 or newer), macOS 13 or later.

            Parlato is free and not signed with a paid certificate:
            - **Windows** shows "Windows protected your PC" the first time. Click **More info**, then **Run anyway**.
            - **Mac:** macOS blocks it twice, once when you open the .dmg and once when you first open Parlato. Each time, click **Done** (not Move to Trash), open **System Settings > Privacy & Security** and click **Open Anyway** next to Parlato. In between, drag Parlato into Applications. Updates don't ask again.

            Step by step: [install guide](https://github.com/mmnzns/Parlato/blob/main/docs/INSTALL.md). Once installed, Parlato updates itself from this page.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust-target }} ${{ matrix.cargo-args }}

      # Fails the release if whisper.cpp was built for this runner's CPU, with
      # AVX-512, or without -O2 (the draft release stays unpublished).
      - name: Check the whisper.cpp CPU baseline
        shell: pwsh
        run: |
          . ./scripts/cpu-baseline.ps1
          Assert-GgmlBaseline src-tauri/Cargo.toml ${{ matrix.arch }} release ${{ matrix.rust-target }}

      - name: Upload ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parlato-${{ matrix.arch }}-installer
          path: src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/
          if-no-files-found: error

      - name: Upload ${{ matrix.arch }} helper record
        uses: actions/upload-artifact@v4
        with:
          name: parlato-${{ matrix.arch }}-helpers-record
          path: helpers-record/
          if-no-files-found: error

  # Parlato : macOS build (Apple silicon). Produces the .dmg plus the
  # updater artifact (Parlato.app.tar.gz + .sig), added to the same draft
  # release and latest.json ("darwin-aarch64") as the Windows jobs.
  #
  # Signed with Parlato's self-signed code-signing certificate (not an
  # Apple Developer ID: no notarization, users click Open Anyway once). The
  # point is a stable signature, so macOS keeps the Accessibility and
  # Microphone permissions and Keychain access across updates. Secrets:
  #   APPLE_CERTIFICATE           base64 of the exported .p12
  #   APPLE_CERTIFICATE_PASSWORD  the .p12 export password
  #   APPLE_SIGNING_IDENTITY      the certificate name
  # They are imported into a temporary keychain by hand (not passed to
  # tauri-action as APPLE_CERTIFICATE), because Tauri's own import expects
  # a trusted Apple-issued identity.
  macos:
    name: macos (arm64)
    # After the Windows jobs: they create the draft release with its
    # description, and running after them avoids two jobs writing
    # latest.json at the same time. tauri-action adds the Mac entry to it.
    needs: [cpu, helpers]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos-arm64

      - name: Download the local AI helpers
        uses: actions/download-artifact@v4
        with:
          name: helpers-aarch64-apple-darwin
          path: src-tauri/binaries

      # Tauri only bundles the externalBin files. Keep the engine's record
      # files (checksums of the unsigned helpers, versions used) as an
      # uploaded artifact instead of leaving them in src-tauri/binaries.
      - name: Set the helper record files aside
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p helpers-record
          mv src-tauri/binaries/SHA256SUMS src-tauri/binaries/build-info.txt helpers-record/
          ls -l src-tauri/binaries

      # A downloaded artifact does not keep the executable bit.
      - name: Make the helper executable
        run: chmod +x src-tauri/binaries/parlato-llm-aarch64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      - name: Enable updater artifacts
        run: |
          node -e "
            const fs = require('fs');
            const f = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.bundle.createUpdaterArtifacts = true;
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          "

      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/parlato-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate is not trusted by default; trust it for
          # code signing on this runner so codesign treats it as valid.
          security find-certificate -c "$APPLE_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem" \
            || echo "::warning::could not mark the certificate as trusted; signing may still work"
          security find-identity -p codesigning "$KEYCHAIN"

      - name: Build + sign + bundle (macOS arm64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Parlato ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Check the signature
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Parlato.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|Identifier|flags"
          # The bundler signs externalBin files with the app identity and the
          # hardened runtime before it signs the app. Check the local AI
          # helper itself: it must be signed, with the same authority, and
          # carry the hardened runtime flag.
          HELPER="$APP/Contents/MacOS/parlato-llm"
          test -f "$HELPER"
          codesign --verify --strict --verbose=2 "$HELPER"
          codesign -dv "$HELPER" 2>&1 | tee helper-sig.txt | grep -E "Authority|Identifier|flags"
          grep -Eq "flags=0x[0-9a-f]+\(.*runtime" helper-sig.txt \
            || { echo "::error::parlato-llm is not signed with the hardened runtime"; exit 1; }
          if ! diff <(codesign -dv "$APP" 2>&1 | grep "^Authority" | head -1) \
                    <(grep "^Authority" helper-sig.txt | head -1) > /dev/null; then
            echo "::error::parlato-llm is signed with a different identity than the app"; exit 1
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parlato-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/
          if-no-files-found: error

      - name: Upload macOS helper record
        uses: actions/upload-artifact@v4
        with:
          name: parlato-macos-arm64-helpers-record
          path: helpers-record/
          if-no-files-found: error

  # NOTE: CUDA builds are not part of Parlato anymore. The graphics card is
  # used through Metal (Mac), Vulkan (the parlato-llm-vulkan helper) and
  # DirectML (Parakeet), all in the normal installer.
